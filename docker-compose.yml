services:
  sea-desk:
    build: .
    image: sea-desk:latest
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - .env
    volumes:
      - relay_data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay_data:
